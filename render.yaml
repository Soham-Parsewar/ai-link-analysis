services:
  - type: web
    name: ai-link-analysis-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        value: ""
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: REQUEST_TIMEOUT
        value: "15"
      - key: MAX_HTML_SIZE_MB
        value: "2"
      - key: MAX_CONTENT_LENGTH
        value: "12000"
